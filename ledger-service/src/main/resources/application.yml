spring:
  application: { name: ledger-service }
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/swiftpay}
    username: ${SPRING_DATASOURCE_USERNAME:swiftpay}
    password: ${SPRING_DATASOURCE_PASSWORD:swiftpay}
  jpa:
    hibernate: { ddl-auto: validate }
    open-in-view: false
  flyway: { enabled: true, baseline-on-migrate: true }
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ledger-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties: { enable.idempotence: true }
    listener:
      ack-mode: manual_immediate

server: { port: 8080 }

management:
  endpoints: { web: { exposure: { include: health,info,metrics,prometheus } } }
  endpoint: { health: { probes: { enabled: true } } }

swiftpay:
  topics:
    payment-initiated: payment.initiated
    payment-completed: payment.completed
    payment-failed: payment.failed
