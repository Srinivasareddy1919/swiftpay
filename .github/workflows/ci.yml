name: SwiftPay CI

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build & Test
        run: mvn -B -ntp clean verify

      - name: Build Docker images
        run: |
          docker build -t swiftpay/transaction-gateway:ci ./transaction-gateway
          docker build -t swiftpay/ledger-service:ci    ./ledger-service
          docker build -t swiftpay/analytics-worker:ci  ./analytics-worker

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*'
